<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice UI Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#e0f2fe',
                            500: '#1E90FF',
                            600: '#1976d2',
                            700: '#1565c0',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">Invoice UI Test</h1>
        
        <!-- Invoice Items Card -->
        <div class="bg-white dark:bg-gray-800 shadow rounded-xl mb-6 transition-all duration-300 hover:shadow-lg">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white">Invoice Items</h3>
                    <div class="flex space-x-2">
                        <button type="button" id="add-item-btn" class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-lg text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 shadow-md hover:shadow-lg">
                            <i class="fas fa-plus mr-2"></i>Add Item
                        </button>
                    </div>
                </div>
            </div>
            <div class="p-6">
                <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Description</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider w-32">Quantity</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider w-32">Unit Price</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider w-32">Total</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider w-16">Action</th>
                            </tr>
                        </thead>
                        <tbody id="formset-container" class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-gray-800">
                            <tr class="formset-row hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors duration-150">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <input type="text" name="items-0-description" maxlength="255" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white" placeholder="Item description" value="Test Item 1">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <input type="number" name="items-0-quantity" value="2" step="0.01" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white quantity-input" placeholder="Quantity">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <input type="number" name="items-0-unit_price" step="0.01" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white price-input" placeholder="Unit price" value="50.00">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900 dark:text-white item-total">$100.00</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                                    <button type="button" class="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 remove-item-btn transition-colors duration-200" title="Remove item">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Totals Summary -->
                <div class="mt-8 bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-700 dark:to-gray-800 rounded-xl p-6 shadow-inner">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="lg:col-start-3 lg:col-span-2">
                            <div class="space-y-4">
                                <div class="flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700">
                                    <span class="text-base font-medium text-gray-700 dark:text-gray-300">Subtotal:</span>
                                    <span class="text-base font-semibold text-gray-900 dark:text-white" id="subtotal">$100.00</span>
                                </div>
                                <div class="flex justify-between items-center py-2 border-b border-gray-200 dark:border-gray-700">
                                    <span class="text-base font-medium text-gray-700 dark:text-gray-300">Tax (<span id="tax-rate-display">10</span>%):</span>
                                    <span class="text-base font-semibold text-gray-900 dark:text-white" id="tax">$10.00</span>
                                </div>
                                <div class="flex justify-between items-center pt-4">
                                    <span class="text-xl font-bold text-gray-900 dark:text-white">Total:</span>
                                    <span class="text-2xl font-bold text-indigo-600 dark:text-indigo-400" id="total">$110.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Keep track of the formset index
        let formsetIndex = 1;

        // Function to format currency
        function formatCurrency(amount) {
            return '$' + parseFloat(amount).toFixed(2);
        }

        // Function to add a new formset item
        document.getElementById('add-item-btn').addEventListener('click', function() {
            const formsetContainer = document.getElementById('formset-container');
            
            // Create a new row
            const newRow = document.createElement('tr');
            newRow.className = 'formset-row hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors duration-150';
            newRow.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap">
                    <input type="text" name="items-${formsetIndex}-description" maxlength="255" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white" placeholder="Item description">
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <input type="number" name="items-${formsetIndex}-quantity" value="1" step="0.01" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white quantity-input" placeholder="Quantity">
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <input type="number" name="items-${formsetIndex}-unit_price" step="0.01" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white price-input" placeholder="Unit price">
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900 dark:text-white item-total">$0.00</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                    <button type="button" class="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 remove-item-btn transition-colors duration-200" title="Remove item">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            `;
            
            formsetContainer.appendChild(newRow);
            
            // Increment the formset index
            formsetIndex = parseInt(formsetIndex) + 1;
            
            // Add event listeners to the new inputs
            const quantityInput = newRow.querySelector('.quantity-input');
            const priceInput = newRow.querySelector('.price-input');
            
            quantityInput.addEventListener('input', updateTotals);
            priceInput.addEventListener('input', updateTotals);
            
            // Add event listener to the new remove button
            const removeButton = newRow.querySelector('.remove-item-btn');
            removeButton.addEventListener('click', function() {
                removeRow(this);
            });
            
            // Update totals
            updateTotals();
        });

        function removeRow(button) {
            const row = button.closest('.formset-row');
            row.remove();
            updateTotals();
        }

        function updateTotals() {
            let subtotal = 0;
            const rows = document.querySelectorAll('.formset-row');
            
            rows.forEach(row => {
                const quantityInput = row.querySelector('input[name$="-quantity"]');
                const unitPriceInput = row.querySelector('input[name$="-unit_price"]');
                const totalElement = row.querySelector('.item-total');
                
                if (quantityInput && unitPriceInput && totalElement) {
                    const quantity = parseFloat(quantityInput.value) || 0;
                    const unitPrice = parseFloat(unitPriceInput.value) || 0;
                    const total = quantity * unitPrice;
                    
                    // Update row total
                    totalElement.textContent = formatCurrency(total);
                    
                    subtotal += total;
                }
            });
            
            // Get tax rate
            const taxRateInput = document.getElementById('tax-rate-display');
            const taxRate = parseFloat(taxRateInput.textContent) || 0;
            
            // Calculate tax and total
            const tax = subtotal * (taxRate / 100);
            const total = subtotal + tax;
            
            // Update summary totals
            document.getElementById('subtotal').textContent = formatCurrency(subtotal);
            document.getElementById('tax').textContent = formatCurrency(tax);
            document.getElementById('total').textContent = formatCurrency(total);
        }

        // Add event listeners for real-time calculation
        document.addEventListener('DOMContentLoaded', function() {
            // Add event listeners to existing inputs
            document.addEventListener('input', function(e) {
                if (e.target.classList.contains('quantity-input') || e.target.classList.contains('price-input')) {
                    updateTotals();
                }
            });
            
            // Add event listeners to all remove buttons
            document.querySelectorAll('.remove-item-btn').forEach(button => {
                button.addEventListener('click', function() {
                    removeRow(this);
                });
            });
            
            // Initial calculation
            updateTotals();
        });
    </script>
</body>
</html>
